[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c4002-python"
version = "0.1.0"
description = "Unofficial Python driver and tools for DFRobot C4002 (SEN0691) 24GHz mmWave radar sensor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "nobudev7" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
gpio = [
    "RPi.GPIO>=0.7.1",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/nobudev7/c4002-python"
Documentation = "https://github.com/nobudev7/c4002-python#readme"
Issues = "https://github.com/nobudev7/c4002-python/issues"
Repository = "https://github.com/nobudev7/c4002-python.git"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "PYI034",  # Requires typing.Self which was only added in Python 3.11
]
